[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers
markers =
    smoke: 冒烟用例（核心主路径）
    slow: 较慢用例
    real_env: 仅真实环境（非 dev）时运行
    mock_only: 仅 dev 环境运行（Flask Mock 业务用例）
    backend: 后端接口测试用例（real 环境主跑，dev 也可跑后端联调）
    security: 接口安全测试维度
    performance: 性能/压测维度
    contract: 契约测试维度
    db_check: 数据库白盒校验维度
filterwarnings =
    ignore::DeprecationWarning
