# 与 Jenkins 共用 scripts/ci_test.sh，保证「本机 / GH / Jenkins」同一入口
name: api-tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: "smoke or full"
        required: true
        default: smoke
        type: choice
        options: [smoke, full]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        test-env: ["dev", "real"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Run suite
        env:
          TEST_ENV: ${{ matrix.test-env }}
        run: |
          chmod +x scripts/ci_test.sh
          SUITE="${{ github.event.inputs.suite || 'full' }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then SUITE=smoke; fi
          bash scripts/ci_test.sh "$SUITE"

      - name: Upload JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-py${{ matrix.python-version }}-${{ matrix.test-env }}
          path: reports/junit.xml
          retention-days: 7

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-py${{ matrix.python-version }}-${{ matrix.test-env }}
          path: allure-results/
          retention-days: 7
